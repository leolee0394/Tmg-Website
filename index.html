<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>Thematic VC | The March Group</title>
<meta name="description" content="The March Group is backing exponential technology platforms for human and planetary health, and a new food paradigm.">
</head>
<body data-page="home" id="top">
<header id="site-header" class="site-header"></header>
<main>
  <section class="story" data-bg="var(--lichen)" data-fg="var(--ink)">
    <div class="caps">
      <div class="cap cap1"><h1 data-text="hero.headline"></h1><p class="hint">Scroll</p></div>
      <div class="cap cap2">
        <p class="split"><span class="dot a"></span><span data-text="hero.food"></span></p>
        <p class="split"><span class="dot b"></span><span data-text="hero.medicine"></span></p>
        <p class="line" data-text="hero.splitLine"></p>
      </div>
      <div class="cap cap3"><h2 data-text="hero.merged"></h2><p class="sub" data-text="hero.sub"></p><a class="btn" href="contact.html">Send us a deal</a></div>
    </div>
    <div class="stage">
      <svg id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Two organic shapes, food and medicine, split apart and then interlock">
        <g id="grow"><path id="shA"/><path id="shB"/></g>
      </svg>
    </div>
  </section>

  <div class="themes-intro" data-bg="var(--lichen)" data-fg="var(--ink)"><h2 class="sec-h" data-text="sections.themes"></h2></div>
  <div id="themes"></div>

  <section class="explore" data-bg="var(--lichen)" data-fg="var(--ink)">
    <h2 class="sec-h" data-text="sections.explore"></h2>
    <div class="tiles" id="explore"></div>
  </section>

  <section class="close" data-bg="var(--close)" data-fg="#FFFFFF">
    <h2 data-text="sections.contact"></h2>
    <p class="lede" data-text="sections.contactSub"></p>
    <div class="cta"><a class="btn" href="mailto:investment@marchfund.com">Pitch us</a><a class="btn ghost" href="contact.html">Contact and mailing list</a></div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="render.js"></script>
<script src="motion.js"></script>
</body>
</html>
